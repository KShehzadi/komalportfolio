<!doctype html>
<!--
  Source for public/og-image.png, the 1200 × 630 picture LinkedIn, WhatsApp,
  Slack and X show when someone shares the site. Edit this, then run
  `npm run og-image`.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css?family=Montserrat:500,700,800&display=block"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }
      body {
        display: grid;
        grid-template-columns: 420px 1fr;
        align-items: center;
        gap: 64px;
        padding: 0 80px;
        font-family: "Montserrat", sans-serif;
        color: #fff;
        background: radial-gradient(
            circle at 18% 30%,
            rgba(145, 94, 255, 0.35),
            transparent 55%
          ),
          radial-gradient(circle at 90% 90%, rgba(0, 200, 160, 0.16), transparent 45%),
          #050816;
      }
      .portrait {
        width: 420px;
        height: 420px;
        border-radius: 36px;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.18);
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.55),
          18px 18px 0 -2px rgba(145, 94, 255, 0.45);
      }
      .portrait img {
        display: block;
        width: 100%;
        height: 100%;
      }
      .eyebrow {
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: #aaa6c3;
      }
      h1 {
        margin: 14px 0 6px;
        font-size: 76px;
        font-weight: 800;
        line-height: 1.02;
        letter-spacing: -0.02em;
      }
      h1 span {
        color: #915eff;
      }
      .role {
        font-size: 32px;
        font-weight: 700;
      }
      .focus {
        margin-top: 26px;
        font-size: 24px;
        line-height: 1.5;
        color: #d6d2ec;
      }
      .url {
        margin-top: 34px;
        display: inline-block;
        padding: 10px 22px;
        border-radius: 999px;
        background: rgba(145, 94, 255, 0.18);
        border: 1px solid rgba(145, 94, 255, 0.55);
        font-size: 22px;
        font-weight: 700;
        color: #e9dcff;
      }
    </style>
  </head>
  <body>
    <div class="portrait">
      <img src="../src/assets/images/komal-toon.svg" alt="" />
    </div>
    <div>
      <p class="eyebrow">Lahore, Pakistan · Techlogix</p>
      <h1>Komal <span>Shehzadi</span></h1>
      <p class="role">Principal Software Engineer</p>
      <p class="focus">
        Frontend architecture · Full-stack delivery<br />
        Test automation · AI under review
      </p>
      <p class="url">dev.komalshehzadi.com</p>
    </div>
  </body>
</html>
