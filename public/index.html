    <meta

    <meta property="twitter:url" content="https://dev.komalshehzadi.com/" />
    <meta
      property="twitter:title"
      content="Komal Shehzadi | Principal Software Engineer"

    <meta name="msapplication-TileColor" content="#050816" />
    <meta name="theme-color" content="#050816" />

    <!-- Resolve the theme before first paint so the page never flashes the
         wrong colour. useTheme() reads this attribute back on mount. -->
    <script>
      (function () {
        var themes = ["dark", "day", "purple"];
        // Dark is the intended look — the starfield and violet wash are built
        // for it — so it stays the default regardless of the OS setting. The
        // switch in the nav records an explicit choice here.
        var theme = "dark";
        try {
          var saved = window.localStorage.getItem("theme");
          if (themes.indexOf(saved) !== -1) {
            theme = saved;
          }
        } catch (e) {
          /* storage blocked — keep the default */
        }
        document.documentElement.setAttribute("data-theme", theme);
      })();
    </script>
    <style>
      /* ground colour per theme, before the stylesheet arrives */
      html {
        background: #050816;
      }
      html[data-theme="day"] {
        background: #f6f7fb;
      }
      html[data-theme="purple"] {
        background: #17082e;
      }
    </style>

    <!-- Customize icons -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="%PUBLIC_URL%/favicon-32x32.png?v8=qAJ44G5Bm7"
    />
    <link
      rel="icon"

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- NOTE: the font files are hashed by webpack at build time, so they cannot
         be preloaded by name from this static template — the old hard-coded
         hashes here 404'd on every page load. The @font-face rules in
         src/index.css load them with font-display: swap instead. -->

    <!-- Global site tag (gtag.js) - Google Analytics -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=UA-135618960-2"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());

      gtag("config", "UA-135618960-2");
    </script>

    <!-- Font Awesome, loaded without blocking the first paint. Warming the
         connection first, then swapping the sheet in on load; the <noscript>
         copy keeps icons working with JavaScript disabled. -->
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/FortAwesome/Font-Awesome@5.15.4/css/all.min.css"
      media="print"
      onload="this.media='all';this.onload=null"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/gh/FortAwesome/Font-Awesome@5.15.4/css/all.min.css"
      />
    </noscript>

    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
